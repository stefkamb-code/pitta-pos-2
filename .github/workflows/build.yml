name: Build PittaPos (Windows, χωρίς εγκατάσταση .NET στο μαγαζί)

on:
  workflow_dispatch:
  push:
    branches: [ main, claude/remote-commands-hnl8f1 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Το ίδιο setup με το scripts/make-setup.sh (εκεί και το --self-contained: το .NET μπαίνει μέσα στο .exe, ο
      # υπολογιστής του μαγαζιού δεν θέλει τίποτα εγκατεστημένο, μόνο Windows 10/11 x64) — για να κατεβαίνει από τη
      # σελίδα του build όταν δεν είσαι στον υπολογιστή ανάπτυξης. ΧΩΡΙΣ πελατολόγιο: αυτό ζει μόνο στην Επιφάνεια.
      # Σε ταμείο που δουλεύει ήδη δεν λείπει τίποτα — οι πελάτες του μένουν στο %AppData%\PittaPos2.
      - name: Setup του μαγαζιού
        shell: bash
        env:
          PITTA_SETUP_OUT: setup-out
        run: mkdir -p setup-out && bash scripts/make-setup.sh

      # Κρατιέται 3 μέρες, και αν γεμίσει ο χώρος του GitHub το build ΔΕΝ βγαίνει «αποτυχία» (ούτε email).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PittaPOS2-Setup
          path: setup-out/*.bat
          retention-days: 3
